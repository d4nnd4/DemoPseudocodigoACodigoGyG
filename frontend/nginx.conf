server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Necesario para que el streaming de tokens llegue en tiempo real
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
    }

    # Guías en Markdown (docs/) como texto plano legible en el navegador
    location /docs/ {
        types { text/plain md; }
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
